<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반월초 특별실 예약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ───── 글씨체: 국어 앱과 맞추려면 이 두 줄만 바꾸면 됩니다 ───── */
  :root{
    --font-title: 'Gowun Batang', 'Noto Serif KR', serif;
    --font-body: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

    --bg:#f6f4ef; --paper:#ffffff; --ink:#1f2328; --ink-2:#4a5058; --ink-3:#7a8089;
    --line:#dcd8cf; --line-2:#ebe8e1; --accent:#2b4c7e; --accent-soft:#e8eef7;
    --danger:#c62828; --danger-soft:#fdecec; --ok:#2e7d32; --none:#f0eee9;
    --g1:#2e7d32; --g1s:#e7f4e8;  --g2:#00796b; --g2s:#e0f2f0;
    --g3:#b26a00; --g3s:#fff3dc;  --g4:#c2410c; --g4s:#ffeadf;
    --g5:#1d4ed8; --g5s:#e5edff;  --g6:#6d28d9; --g6s:#f0e8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}

  /* 로그인 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:44px 40px;width:100%;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.05)}
  .login-card .school{font-size:15px;color:var(--ink-3);letter-spacing:.15em}
  .login-card h1{font-family:var(--font-title);font-size:34px;margin:8px 0 6px}
  .login-card p{color:var(--ink-2);margin:0 0 28px}
  .login-card input{width:100%;padding:16px;border:2px solid var(--line);border-radius:12px;font-size:20px;text-align:center;letter-spacing:.2em;outline:none}
  .login-card input:focus{border-color:var(--accent)}
  .login-card .btn-primary{width:100%;margin-top:14px;padding:16px;font-size:19px}
  .login-err{color:var(--danger);font-weight:600;min-height:26px;margin-top:12px}

  /* 공통 버튼 */
  .btn{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600}
  .btn:hover{border-color:var(--ink-3)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;border-radius:12px;font-weight:700}
  .btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
  .btn-danger{background:var(--paper);border-color:var(--danger);color:var(--danger)}

  /* 헤더 */
  header{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-family:var(--font-title);font-size:28px;margin:0}
  header .sub{color:var(--ink-3);font-size:15px}
  header .spacer{flex:1}
  .demo-badge{background:#fff3dc;color:#8a5300;border:1px solid #f0d199;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}

  main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}

  /* 툴바 */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .tabs{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:5px;gap:4px}
  .tab{border:none;background:transparent;padding:12px 26px;border-radius:10px;font-size:19px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .tab.on{background:var(--accent);color:#fff}
  .tab .cnt{background:var(--danger);color:#fff;border-radius:999px;font-size:13px;padding:1px 8px;font-weight:700}
  .weeknav{display:flex;align-items:center;gap:8px;margin-left:auto}
  .weeknav .label{font-family:var(--font-title);font-size:21px;font-weight:700;min-width:250px;text-align:center}
  .weeknav .btn{padding:10px 14px}

  /* 겹침 알림 */
  .alert{background:var(--danger-soft);border:2px solid var(--danger);border-radius:14px;padding:14px 18px;margin-bottom:16px}
  .alert h3{margin:0 0 6px;color:var(--danger);font-size:18px}
  .alert ul{margin:0;padding-left:20px}
  .alert li{margin:3px 0;cursor:pointer}
  .alert li:hover{text-decoration:underline}
  .okbar{background:#eef7ee;border:1.5px solid #b9dcbb;color:var(--ok);border-radius:14px;padding:12px 18px;margin-bottom:16px;font-weight:600}

  /* 시간표 */
  .grid-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px}
  table.grid{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
  .grid th,.grid td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);vertical-align:top}
  .grid tr>*:last-child{border-right:none}
  .grid thead th{background:#faf9f6;padding:14px 8px;font-size:18px;font-weight:700;border-bottom:2px solid var(--line)}
  .grid thead th .d{display:block;font-size:14px;color:var(--ink-3);font-weight:500}
  .grid thead th.today{background:var(--accent-soft);color:var(--accent)}
  .grid thead th.today .d{color:var(--accent)}
  .grid th.slot{width:160px;text-align:left;padding:12px 14px;background:#faf9f6}
  .slot b{font-size:19px;display:block}
  .slot .t{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .slot .w{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
  .slot .w.low{background:var(--g1s);color:var(--g1)}
  .slot .w.high{background:var(--g5s);color:var(--g5)}
  .slot .n{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px}
  tr.lunch-row th.slot{background:#f7f5ef}
  td.cell{padding:8px;height:92px;cursor:pointer;transition:background .12s;position:relative}
  td.cell:hover{background:#fbfaf7}
  td.cell.today{background:#f7f9fd}
  td.cell .hint{color:#b5b1a8;font-size:13.5px;position:absolute;inset:auto 10px 8px auto}
  td.cell .plus{display:none;position:absolute;right:10px;top:8px;color:var(--accent);font-weight:800;font-size:20px}
  td.cell:hover .plus{display:block}
  td.cell.none{background:repeating-linear-gradient(135deg,var(--none) 0 8px,#f6f4ef 8px 16px);cursor:default}
  td.cell.none .hint{position:static;display:block;text-align:center;margin-top:26px;color:#a8a399}
  td.cell.conflict{background:var(--danger-soft);box-shadow:inset 0 0 0 3px var(--danger)}
  td.cell.conflict .warn{display:block;color:var(--danger);font-weight:800;font-size:14px;margin-bottom:4px}
  td.cell.flash{animation:flash 1.2s ease 2}
  @keyframes flash{50%{box-shadow:inset 0 0 0 5px var(--danger);background:#ffd6d6}}

  .chip{display:block;border-radius:9px;padding:7px 10px;margin-bottom:6px;border-left:5px solid;font-weight:700;font-size:17px;line-height:1.3;cursor:pointer}
  .chip small{display:block;font-weight:500;font-size:13.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:hover{filter:brightness(.96)}
  .gc1{background:var(--g1s);border-color:var(--g1);color:#1b4d1e}
  .gc2{background:var(--g2s);border-color:var(--g2);color:#00463e}
  .gc3{background:var(--g3s);border-color:var(--g3);color:#6b4000}
  .gc4{background:var(--g4s);border-color:var(--g4);color:#7c2a08}
  .gc5{background:var(--g5s);border-color:var(--g5);color:#132f86}
  .gc6{background:var(--g6s);border-color:var(--g6);color:#43188a}
  .gc0{background:#e9e7e1;border-color:#3a3f46;color:#22262c}
  .seg.grades button.on.g0{background:#3a3f46;border-color:#3a3f46}
  .slot-help{width:100%;color:var(--ink-3);font-size:14px;margin-top:2px}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--ink-2);font-size:15px;align-items:center}
  .legend .dot{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

  /* 모달 */
  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50}
  .modal{background:var(--paper);border-radius:18px;width:100%;max-width:620px;padding:28px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal h2{font-family:var(--font-title);font-size:26px;margin:0 0 18px}
  .field{margin-bottom:18px}
  .field>label{display:block;font-weight:700;margin-bottom:8px;font-size:16px}
  .field>label .opt{color:var(--ink-3);font-weight:500;font-size:14px}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:700;font-size:17px;min-width:64px}
  .seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .seg button:disabled{opacity:.35;cursor:not-allowed}
  .seg.slots button{text-align:left;line-height:1.25}
  .seg.slots button small{display:block;font-weight:500;font-size:13px;opacity:.85}
  .seg.grades button.on.g1{background:var(--g1);border-color:var(--g1)} .seg.grades button.on.g2{background:var(--g2);border-color:var(--g2)}
  .seg.grades button.on.g3{background:var(--g3);border-color:var(--g3)} .seg.grades button.on.g4{background:var(--g4);border-color:var(--g4)}
  .seg.grades button.on.g5{background:var(--g5);border-color:var(--g5)} .seg.grades button.on.g6{background:var(--g6);border-color:var(--g6)}
  .inp{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-size:17px;outline:none;background:#fff}
  .inp:focus{border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .msg{border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:16px}
  .msg.bad{background:var(--danger-soft);color:var(--danger);border:2px solid var(--danger)}
  .msg.good{background:#eef7ee;color:var(--ok);border:1.5px solid #b9dcbb}
  .msg.info{background:#f3f2ee;color:var(--ink-2)}
  .modal-actions{display:flex;gap:10px;align-items:center;margin-top:6px}
  .modal-actions .spacer{flex:1}
  .modal-actions .btn{padding:12px 20px;font-size:17px}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#22262c;color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  @media (max-width:720px){
    header{padding:14px 16px} header h1{font-size:23px}
    .weeknav{margin-left:0;width:100%;justify-content:space-between}
    .weeknav .label{min-width:0;font-size:17px}
    .tab{padding:10px 18px;font-size:17px}
    .row2{grid-template-columns:1fr}
  }
  /* 관리자 */
  .admin-badge{background:#2b2f36;color:#fff;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
  .modal.wide{max-width:1040px}
  .atabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:18px}
  .atab{border:none;background:none;padding:10px 18px;font-size:17px;font-weight:700;color:var(--ink-3);border-bottom:3px solid transparent;margin-bottom:-2px}
  .atab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .atab .cnt{background:var(--danger);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;margin-left:4px}
  .atable{width:100%;border-collapse:collapse}
  .atable th{text-align:left;font-size:14px;color:var(--ink-3);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
  .atable td{padding:8px 6px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  .atable .inp{padding:9px 10px;font-size:16px}
  .atable input[type=time]{width:100%;min-width:140px}
  .atable td.acts{white-space:nowrap}
  .ibtn{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-weight:700;font-size:15px}
  .ibtn:hover{border-color:var(--ink-3)}
  .ibtn.del{color:var(--danger);border-color:#f0bcbc}
  .ibtn:disabled{opacity:.3;cursor:not-allowed}
  .avail-sum{font-size:14px;color:var(--ink-2);line-height:1.4}
  tr.matrix-row td{background:#faf9f6;padding:12px 14px}
  .matrix{border-collapse:collapse}
  .matrix th,.matrix td{padding:4px 6px;text-align:center;font-size:15px}
  .matrix th{color:var(--ink-2)}
  .mbox{width:44px;height:36px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:800;color:transparent}
  .mbox.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .addrow{display:flex;gap:8px;margin-top:14px}
  .addrow .inp{max-width:280px}
  .help{color:var(--ink-3);font-size:14.5px;margin:0 0 14px}
  .orphan{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .orphan .spacer{flex:1}
  /* 요청사항 */
  .req{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .req-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .req-head .spacer{flex:1}
  .rtype{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:13.5px;font-weight:700}
  .rdate{color:var(--ink-3);font-size:13.5px}
  .rstat{border-radius:999px;padding:2px 10px;font-size:13.5px;font-weight:700}
  .st-new{background:#fff3dc!important;color:#8a5300!important;border-color:#f0d199!important}
  .st-doing{background:var(--accent-soft)!important;color:var(--accent)!important;border-color:#b9c9e4!important}
  .st-done{background:#eef7ee!important;color:var(--ok)!important;border-color:#b9dcbb!important}
  .req-text{margin-top:6px;white-space:pre-wrap;word-break:break-word}
  .req-reply{margin-top:8px;background:#f6f4ef;border-radius:10px;padding:8px 12px;font-size:15.5px}
  .req-reply b{color:var(--accent)}
  .seg.small button{padding:5px 11px;font-size:14px;min-width:0;border-width:1.5px}
  textarea.inp{resize:vertical;min-height:110px;line-height:1.5}
  .hbadge{background:var(--danger);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;margin-left:4px}

  /* 사용 도우미 챗봇 */
  #chatFab{position:fixed;right:22px;bottom:22px;z-index:40;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:15px 22px;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(43,76,126,.35)}
  #chatFab:hover{filter:brightness(1.08)}
  #chat{position:fixed;right:22px;bottom:22px;z-index:45;width:400px;max-width:calc(100vw - 24px);height:600px;max-height:calc(100vh - 44px);background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
  .chat-head{background:var(--accent);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
  .chat-head b{font-family:var(--font-title);font-size:20px}
  .chat-head span{font-size:13.5px;opacity:.85}
  .chat-head .spacer{flex:1}
  .chat-head button{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;width:34px;height:34px;font-size:18px}
  #chatLog{flex:1;overflow-y:auto;padding:16px 14px;background:#faf9f6}
  .bubble{max-width:88%;padding:10px 14px;border-radius:14px;margin-bottom:10px;line-height:1.55;font-size:16px;word-break:break-word}
  .bubble.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
  .bubble.me{background:var(--accent);color:#fff;margin-left:auto;border-top-right-radius:4px}
  .bubble ol,.bubble ul{margin:6px 0;padding-left:20px}
  .bubble li{margin:3px 0}
  .bubble table{border-collapse:collapse;margin-top:6px;font-size:14.5px;width:100%}
  .bubble td{padding:3px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
  .bubble .free{color:var(--ok);font-weight:700}
  .bubble .busy{font-weight:700}
  .bubble .bad{color:var(--danger);font-weight:700}
  .bubble .act{display:inline-block;margin:6px 6px 0 0;border:1.5px solid var(--accent);color:var(--accent);background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:14.5px}
  .quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line-2);background:#fff}
  .quick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .quick button:hover{border-color:var(--accent);color:var(--accent)}
  .chat-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
  .chat-in input{flex:1;padding:11px 14px;border:2px solid var(--line);border-radius:12px;font-size:16px;outline:none}
  .chat-in input:focus{border-color:var(--accent)}
  .chat-in button{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:0 16px;font-weight:700}
  @media (max-width:720px){ #chat{right:12px;bottom:12px;height:calc(100vh - 24px)} #chatFab{right:14px;bottom:14px;padding:13px 18px} }
</style>
</head>
<body>

<!-- 로그인 -->
<section id="login">
  <div class="login-card">
    <div class="school">반월초등학교</div>
    <h1>특별실 예약</h1>
    <p>특별실 사용 일정을 함께 확인해요</p>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus>
      <button class="btn btn-primary" type="submit">들어가기</button>
    </form>
    <div class="login-err" id="loginErr"></div>
  </div>
</section>

<!-- 본 화면 -->
<section id="app" class="hidden">
  <header>
    <div>
      <h1>특별실 예약</h1>
      <div class="sub">반월초등학교 교직원 공유</div>
    </div>
    <span class="demo-badge hidden" id="demoBadge">미리보기 모드 · 이 기기에만 저장</span>
    <span class="admin-badge hidden" id="adminBadge">관리자 모드</span>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="newBtn" style="padding:12px 20px;font-size:17px">+ 예약하기</button>
    <button class="btn" id="reqBtn">요청하기</button>
    <button class="btn" id="adminBtn">관리자</button>
    <button class="btn" id="logoutBtn">나가기</button>
  </header>

  <main>
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <div class="weeknav">
        <button class="btn" id="prevW">◀ 이전 주</button>
        <div class="label" id="weekLabel"></div>
        <button class="btn" id="nextW">다음 주 ▶</button>
        <button class="btn" id="thisW">이번 주</button>
      </div>
    </div>

    <div id="alertBox"></div>

    <div class="grid-wrap"><table class="grid" id="grid"></table></div>

    <div class="legend">
      <span><span class="dot" style="background:#3a3f46"></span>전 학년</span>
      <span><span class="dot" style="background:var(--g1)"></span>1학년</span>
      <span><span class="dot" style="background:var(--g2)"></span>2학년</span>
      <span><span class="dot" style="background:var(--g3)"></span>3학년</span>
      <span><span class="dot" style="background:var(--g4)"></span>4학년</span>
      <span><span class="dot" style="background:var(--g5)"></span>5학년</span>
      <span><span class="dot" style="background:var(--g6)"></span>6학년</span>
      <span><span class="dot" style="background:var(--danger-soft);box-shadow:inset 0 0 0 2px var(--danger)"></span>시간 겹침</span>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ════════════════════════════════════════════════
   1) Firebase 설정 (school 프로젝트)
   ════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDPg8nclz-OoVhUMAcJuMoPvvQBOeHN4Hg",
  authDomain: "school-b5828.firebaseapp.com",
  // ⚠ Realtime Database 데이터 탭 맨 위 주소와 같은지 확인하세요 (미국 지역이면 https://school-b5828-default-rtdb.firebaseio.com)
  databaseURL: "https://school-b5828-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "school-b5828",
  storageBucket: "school-b5828.firebasestorage.app",
  messagingSenderId: "229836109104",
  appId: "1:229836109104:web:9c3215ea4d9435612cc4f5"
};
const ROOT = "teukbyeolsil";            // 교직원 데이터 경로 (규칙과 같아야 함)
const ADMIN_ROOT = "teukbyeolsil_admin"; // 관리자 확인용 경로 (규칙과 같아야 함)

/* ════════════════════════════════════════════════
   2) 기본 설정 — 관리자가 저장하기 전까지 이 값을 씁니다
      avail: 학년별로 그 교시가 있는 요일 (1=월 … 5=금)
   ════════════════════════════════════════════════ */
const ALL = "12345";
const DEFAULT_CONFIG = {
  rooms: {
    computer: { name: "컴퓨터실", order: 0 },
    hall:     { name: "강당",     order: 1 }
  },
  slots: {
    p1:  { label:"1교시", start:"09:00", end:"09:40", who:"전 학년", avail:{g1:ALL,g2:ALL,g3:ALL,g4:ALL,g5:ALL,g6:ALL} },
    p2:  { label:"2교시", start:"09:50", end:"10:30", who:"전 학년", avail:{g1:ALL,g2:ALL,g3:ALL,g4:ALL,g5:ALL,g6:ALL} },
    p3:  { label:"3교시", start:"10:40", end:"11:20", who:"전 학년", avail:{g1:ALL,g2:ALL,g3:ALL,g4:ALL,g5:ALL,g6:ALL} },
    p4h: { label:"4교시", start:"11:30", end:"12:10", who:"고학년", note:"저학년 점심시간", avail:{g3:ALL,g4:ALL,g5:ALL,g6:ALL} },
    p4l: { label:"4교시", start:"12:10", end:"12:50", who:"저학년", note:"고학년 점심시간", avail:{g1:ALL,g2:ALL} },
    p5:  { label:"5교시", start:"13:00", end:"13:40", who:"전 학년 공통", avail:{g1:"234",g2:"234",g3:ALL,g4:ALL,g5:ALL,g6:ALL} },
    p6:  { label:"6교시", start:"13:50", end:"14:30", who:"고학년", avail:{g3:"2",g4:"2",g5:"1245",g6:"1245"} }
  }
};
const DOW = ["일","월","화","수","목","금","토"];
const GRADES = [1,2,3,4,5,6];

let cfg = clone(DEFAULT_CONFIG);
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* ── 설정 읽기 도우미 ── */
const toMin = t => { const [h,m] = String(t).split(":").map(Number); return h*60+m; };
function roomList(){ return Object.entries(cfg.rooms||{}).map(([id,r]) => ({id, ...r})).sort((a,b) => (a.order??0)-(b.order??0)); }
function slotList(c = cfg){ return Object.entries(c.slots||{}).map(([id,s]) => ({id, ...s})).sort((a,b) => toMin(a.start)-toMin(b.start) || String(a.label).localeCompare(b.label)); }
const slotById = id => { const s = (cfg.slots||{})[id]; return s ? {id, ...s} : null; };
const roomName = id => ((cfg.rooms||{})[id]||{}).name || "(삭제된 특별실)";
function slotsFor(grade, dow){
  if (dow < 1 || dow > 5) return [];
  if (Number(grade) === 0) return slotList().filter(s => GRADES.some(g => String((s.avail||{})["g"+g]||"").includes(String(dow)))).map(s => s.id);
  return slotList().filter(s => String((s.avail||{})["g"+grade]||"").includes(String(dow))).map(s => s.id);
}
function gradesFor(slotId, dow){ return GRADES.filter(g => slotsFor(g, dow).includes(slotId)); }
function gradeRangeText(gs, allText = ""){
  if (!gs.length) return "";
  if (gs.length === 6) return allText;
  const contiguous = gs.every((g,i) => i === 0 || g === gs[i-1] + 1);
  if (contiguous && gs.length > 2) return `${gs[0]}~${gs[gs.length-1]}학년`;
  return gs.join("·") + "학년";
}
function slotGrades(s){ return GRADES.filter(g => ((s.avail||{})["g"+g]||"").length); }
function slotBadgeClass(s){ const gs = slotGrades(s); if (!gs.length || gs.length === 6) return ""; if (gs.every(g => g <= 2)) return "low"; if (gs.every(g => g >= 3)) return "high"; return ""; }
function slotWho(s){ return s.who || gradeRangeText(slotGrades(s), "전 학년") || "수업 없음"; }
function daysText(str){
  const d = String(str||"").split("").map(Number).sort();
  if (!d.length) return "";
  if (d.join("") === "12345") return "월~금";
  return d.map(n => DOW[n]).join("·");
}
function availSummary(s){
  const groups = {};
  GRADES.forEach(g => { const v = (s.avail||{})["g"+g]; if (v) (groups[daysText(v)] ||= []).push(g); });
  const parts = Object.entries(groups).map(([days, gs]) => `${gradeRangeText(gs, "전 학년")} ${days}`);
  return parts.length ? parts.join(" / ") : "사용하는 학년 없음";
}

/* ════════════════════════════════════════════════
   3) 날짜 도우미
   ════════════════════════════════════════════════ */
const pad = n => String(n).padStart(2,"0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = x.getDay(); x.setDate(x.getDate() + (w === 0 ? -6 : 1 - w)); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
function weekOfMonthLabel(mon){
  const thu = addDays(mon, 3);
  const first = new Date(thu.getFullYear(), thu.getMonth(), 1);
  const firstThu = addDays(first, (4 - first.getDay() + 7) % 7);
  const n = Math.floor((thu - firstThu) / (7*864e5)) + 1;
  return `${thu.getMonth()+1}월 ${n}주`;
}

/* ════════════════════════════════════════════════
   4) 저장소 (Firebase / 미리보기)
   ════════════════════════════════════════════════ */
const DEMO = !firebaseConfig.apiKey || !firebaseConfig.databaseURL;
const BAD_KEY = /[.#$\[\]\/]/;
let db = null, ref = null, cfgRef = null, reqRef = null, data = {}, reqs = {}, unsubs = [];
let staffPw = null, adminPw = null;

const store = {
  async login(pw){
    if (DEMO){ staffPw = pw; return true; }
    if (!pw || BAD_KEY.test(pw)) return false;
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    const r = db.ref(`${ROOT}/${pw}/reservations`);
    try { await r.limitToFirst(1).once("value"); } catch(e){ return false; }   // 규칙에서 막힘 = 비밀번호 틀림
    ref = r; cfgRef = db.ref(`${ROOT}/${pw}/config`); reqRef = db.ref(`${ROOT}/${pw}/requests`); staffPw = pw;
    return true;
  },
  listen(cb){
    if (DEMO){
      const load = () => {
        try { data = JSON.parse(localStorage.getItem("tbs-demo") || "{}"); } catch(e){ data = {}; }
        try { const c = JSON.parse(localStorage.getItem("tbs-demo-cfg") || "null"); cfg = c && c.rooms ? c : clone(DEFAULT_CONFIG); } catch(e){ cfg = clone(DEFAULT_CONFIG); }
        try { reqs = JSON.parse(localStorage.getItem("tbs-demo-req") || "{}"); } catch(e){ reqs = {}; }
        cb();
      };
      load(); window.addEventListener("storage", load);
      unsubs.push(() => window.removeEventListener("storage", load));
      return;
    }
    const h1 = ref.on("value", s => { data = s.val() || {}; cb(); }, () => toast("연결이 끊겼어요. 다시 로그인해 주세요."));
    const h2 = cfgRef.on("value", s => { const c = s.val(); cfg = c && c.rooms && c.slots ? c : clone(DEFAULT_CONFIG); cb(); });
    const h3 = reqRef.on("value", s => { reqs = s.val() || {}; cb(); }, () => {});
    unsubs.push(() => ref.off("value", h1), () => cfgRef.off("value", h2), () => reqRef.off("value", h3));
  },
  // 요청사항: 교직원은 새로 쓰기만, 상태 변경·답변·삭제는 관리자만
  _saveDemoReq(){ localStorage.setItem("tbs-demo-req", JSON.stringify(reqs)); render(); },
  async addRequest(obj){ if (DEMO){ reqs["q"+Date.now()] = obj; return this._saveDemoReq(); } await reqRef.push(obj); },
  async adminSetRequest(id, patch){   // patch === null 이면 삭제
    if (DEMO){ if (patch === null) delete reqs[id]; else Object.assign(reqs[id], patch); return this._saveDemoReq(); }
    const up = { [`${ADMIN_ROOT}/${adminPw}/stamp`]: firebase.database.ServerValue.TIMESTAMP };
    if (patch === null) up[`${ROOT}/${staffPw}/requests/${id}`] = null;
    else Object.entries(patch).forEach(([k,v]) => up[`${ROOT}/${staffPw}/requests/${id}/${k}`] = v);
    await db.ref().update(up);
  },
  _saveDemo(){ localStorage.setItem("tbs-demo", JSON.stringify(data)); render(); },
  async add(obj){ if (DEMO){ data["d"+Date.now()] = obj; return this._saveDemo(); } await ref.push(obj); },
  async update(id,obj){ if (DEMO){ data[id] = obj; return this._saveDemo(); } await ref.child(id).set(obj); },
  async remove(id){ if (DEMO){ delete data[id]; return this._saveDemo(); } await ref.child(id).remove(); },
  // 여러 교시 묶음을 한 번에 바꾸기: oldIds 지우고 recs 새로 쓰기
  async replace(oldIds, recs){
    if (DEMO){ oldIds.forEach(k => delete data[k]); recs.forEach((r,i) => data["d"+Date.now()+"_"+i] = r); return this._saveDemo(); }
    const up = {}; oldIds.forEach(k => up[k] = null); recs.forEach(r => up[ref.push().key] = r);
    await ref.update(up);
  },

  // 관리자: 비밀번호 경로에 서버 시각을 써 보고, 규칙이 허락하면 맞는 비밀번호
  async adminLogin(pw){
    if (DEMO) return !!pw;
    if (!pw || BAD_KEY.test(pw)) return false;
    try { await db.ref().update({ [`${ADMIN_ROOT}/${pw}/stamp`]: firebase.database.ServerValue.TIMESTAMP }); return true; }
    catch(e){ return false; }
  },
  // 설정 저장: 설정 + 관리자 확인 도장을 한 번에 기록 (규칙이 둘을 함께 검사)
  async saveConfig(c){
    if (DEMO){ cfg = c; localStorage.setItem("tbs-demo-cfg", JSON.stringify(c)); render(); return; }
    await db.ref().update({
      [`${ROOT}/${staffPw}/config`]: c,
      [`${ADMIN_ROOT}/${adminPw}/stamp`]: firebase.database.ServerValue.TIMESTAMP
    });
  }
};

/* ════════════════════════════════════════════════
   5) 겹침 찾기 (실제 시각 기준)
   ════════════════════════════════════════════════ */
function dayItems(room, date){
  return Object.entries(data)
    .filter(([,v]) => v.room === room && v.date === date)
    .map(([id,v]) => { const s = slotById(v.slot); return s ? { id, ...v, start:s.start, end:s.end, slotLabel:s.label } : null; })
    .filter(Boolean);
}
const overlap = (a,b) => toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
function conflictGroups(items){
  const arr = [...items].sort((a,b) => toMin(a.start)-toMin(b.start));
  const groups = []; let cur = null;
  arr.forEach(it => {
    if (cur && toMin(it.start) < cur.endMin){ cur.items.push(it); cur.endMin = Math.max(cur.endMin, toMin(it.end)); }
    else { cur = { items:[it], endMin: toMin(it.end) }; groups.push(cur); }
  });
  return groups.filter(g => g.items.length >= 2);
}
function conflictsWith(rec, except){
  const s = slotById(rec.slot); if (!s) return [];
  const ex = new Set([].concat(except || []));
  return dayItems(rec.room, rec.date).filter(o => !ex.has(o.id) && overlap(o, s));
}
function weekConflicts(room, mon){
  const out = [];
  for (let i=0;i<5;i++){
    const date = fmt(addDays(mon,i));
    conflictGroups(dayItems(room, date)).forEach(g => out.push({ date, items: g.items }));
  }
  return out;
}
function orphans(){
  return Object.entries(data).filter(([,v]) => !(cfg.rooms||{})[v.room] || !(cfg.slots||{})[v.slot]).map(([id,v]) => ({id, ...v}));
}

/* ════════════════════════════════════════════════
   6) 화면 그리기
   ════════════════════════════════════════════════ */
let curRoom = null;
let curMon = mondayOf(new Date());
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gradeName = g => Number(g) === 0 ? "전 학년" : `${g}학년`;
const whoText = it => `${gradeName(it.grade)}${it.cls ? " " + esc(it.cls) : ""}`;

function render(){
  const rooms = roomList();
  if (!rooms.find(r => r.id === curRoom)) curRoom = rooms[0]?.id;

  $("tabs").innerHTML = rooms.map(r => {
    const n = weekConflicts(r.id, curMon).length;
    return `<button class="tab ${r.id===curRoom?"on":""}" data-room="${r.id}">${esc(r.name)}${n?`<span class="cnt">겹침 ${n}</span>`:""}</button>`;
  }).join("");

  const fri = addDays(curMon, 4);
  $("weekLabel").textContent = `${curMon.getFullYear()}년 ${weekOfMonthLabel(curMon)} (${md(curMon)}~${md(fri)})`;

  const today = fmt(new Date());
  const days = [0,1,2,3,4].map(i => addDays(curMon, i));
  const perDay = {};
  days.forEach(d => {
    const date = fmt(d); const items = dayItems(curRoom, date);
    const bad = new Set(); conflictGroups(items).forEach(g => g.items.forEach(it => bad.add(it.id)));
    perDay[date] = { items, bad };
  });

  let h = `<thead><tr><th class="slot">시간</th>` + days.map(d =>
    `<th class="${fmt(d)===today?"today":""}">${DOW[d.getDay()]}요일<span class="d">${md(d)}${fmt(d)===today?" · 오늘":""}</span></th>`
  ).join("") + `</tr></thead><tbody>`;

  slotList().forEach(s => {
    h += `<tr><th class="slot"><b>${esc(s.label)}</b><span class="t">${s.start} ~ ${s.end}</span><br><span class="w ${slotBadgeClass(s)}">${esc(slotWho(s))}</span>${s.note?`<span class="n">${esc(s.note)}</span>`:""}</th>`;
    days.forEach(d => {
      const date = fmt(d), dow = d.getDay();
      const allowed = gradesFor(s.id, dow);
      const { items:all, bad } = perDay[date];
      const items = all.filter(it => it.slot === s.id).sort((a,b) => a.grade-b.grade);
      const isToday = date === today;
      if (!allowed.length && !items.length){ h += `<td class="cell none"><span class="hint">수업 없음</span></td>`; return; }
      const conflict = items.some(it => bad.has(it.id));
      h += `<td class="cell ${conflict?"conflict":""} ${isToday?"today":""}" data-date="${date}" data-slot="${s.id}">`;
      if (conflict) h += `<span class="warn">⚠ 시간 겹침</span>`;
      items.forEach(it => {
        const gl = it.group ? groupSlotLabel(groupIdsOf(it.id)) : "";
        const sub = [gl && `${gl} 함께 예약`, it.name, it.memo].filter(Boolean).map(esc).join(" · ");
        h += `<span class="chip gc${it.grade}" data-id="${it.id}">${whoText(it)}${sub?`<small>${sub}</small>`:""}</span>`;
      });
      if (!items.length) h += `<span class="hint">${gradeRangeText(allowed)}</span>`;
      h += `<span class="plus">+</span></td>`;
    });
    h += `</tr>`;
  });
  $("grid").innerHTML = h + `</tbody>`;

  const cf = weekConflicts(curRoom, curMon);
  if (cf.length){
    $("alertBox").innerHTML = `<div class="alert"><h3>⚠ ${esc(roomName(curRoom))} — 이번 주 시간이 겹치는 예약 ${cf.length}건</h3><ul>` +
      cf.map(c => { const d = parse(c.date);
        const st = c.items.reduce((m,i) => toMin(i.start) < toMin(m) ? i.start : m, c.items[0].start);
        const en = c.items.reduce((m,i) => toMin(i.end) > toMin(m) ? i.end : m, c.items[0].end);
        return `<li data-date="${c.date}" data-slot="${c.items[0].slot}"><b>${md(d)}(${DOW[d.getDay()]}) ${st}~${en}</b> — ${c.items.map(i => `${whoText(i)}(${esc(i.slotLabel)})`).join(", ")}</li>`; }).join("") +
      `</ul></div>`;
  } else {
    const any = days.some(d => perDay[fmt(d)].items.length);
    $("alertBox").innerHTML = any ? `<div class="okbar">✓ ${esc(roomName(curRoom))} — 이번 주는 겹치는 예약이 없어요</div>` : "";
  }

  $("adminBadge").classList.toggle("hidden", !adminPw);
  if (typeof renderReqExtras === "function") renderReqExtras();
  $("adminBtn").textContent = adminPw ? "관리자 설정" : "관리자";
}

/* ════════════════════════════════════════════════
   7) 예약 입력창
   ════════════════════════════════════════════════ */
let form = {}, editIds = [];   // editIds: 수정 중인 예약 묶음(연속 교시)의 id들

// 같은 묶음(연속 교시로 한 번에 예약한 것)의 예약 id들
function groupIdsOf(id){
  const v = data[id]; if (!v) return [];
  if (!v.group) return [id];
  return Object.keys(data).filter(k => data[k].group === v.group);
}
function groupSlotLabel(ids){
  const labels = slotList().filter(s => ids.some(k => data[k] && data[k].slot === s.id)).map(s => s.label.replace("교시",""));
  return labels.length > 1 ? labels.join("·") + "교시" : "";
}

function openForm(preset = {}, id = null){
  editIds = id ? groupIdsOf(id) : [];
  const slots = id ? editIds.map(k => data[k].slot) : (preset.slot ? [preset.slot] : []);
  form = { room: curRoom, date: "", grade: null, cls:"", name:"", memo:"", ...preset, slots };
  delete form.slot; delete form.group;
  if (!form.date){ const t = new Date(); const d = (t.getDay()===0||t.getDay()===6) ? addDays(mondayOf(t),7) : t; form.date = fmt(d); }
  if (!id) form.name = form.name || localStorage.getItem("tbs-name") || "";
  $("mTitle").textContent = id ? "예약 수정" : "예약하기";
  $("delBtn").classList.toggle("hidden", !id);
  $("fDate").value = form.date; $("fCls").value = form.cls || ""; $("fName").value = form.name || ""; $("fMemo").value = form.memo || "";
  drawForm();
  $("overlay").classList.remove("hidden");
}
function closeForm(){ $("overlay").classList.add("hidden"); }
const hasGrade = () => form.grade !== null && form.grade !== undefined;

function drawForm(){
  $("fRoom").innerHTML = roomList().map(r => `<button type="button" class="${form.room===r.id?"on":""}" data-v="${r.id}">${esc(r.name)}</button>`).join("");
  $("fGrade").innerHTML = [0, ...GRADES].map(g => `<button type="button" class="g${g} ${form.grade===g?"on":""}" data-v="${g}">${gradeName(g)}</button>`).join("");

  const dow = form.date ? parse(form.date).getDay() : -1;
  const avail = hasGrade() ? slotsFor(form.grade, dow) : [];
  if (hasGrade()) form.slots = form.slots.filter(id => avail.includes(id));
  if (!hasGrade()){
    $("fSlot").innerHTML = `<div class="msg info" style="margin:0">학년을 먼저 골라 주세요. 학년·요일에 맞는 교시만 보여요.</div>`;
  } else if (dow === 0 || dow === 6){
    $("fSlot").innerHTML = `<div class="msg info" style="margin:0">주말에는 예약할 수 없어요.</div>`;
  } else if (!avail.length){
    $("fSlot").innerHTML = `<div class="msg info" style="margin:0">이 학년은 이 요일에 예약할 수 있는 교시가 없어요.</div>`;
  } else {
    $("fSlot").innerHTML = slotList().filter(s => avail.includes(s.id)).map(s =>
      `<button type="button" class="${form.slots.includes(s.id)?"on":""}" data-v="${s.id}">${esc(s.label)}<small>${s.start}~${s.end}</small></button>`).join("") +
      `<div class="slot-help">여러 교시를 한 번에 고를 수 있어요 (예: 1·2교시 연속). 다시 누르면 빠져요.</div>`;
  }

  let msg = "";
  if (hasGrade() && form.slots.length && form.date && form.room){
    const seen = new Set(), c = [];
    form.slots.forEach(sid => conflictsWith({ room:form.room, date:form.date, slot:sid }, editIds).forEach(o => { if (!seen.has(o.id)){ seen.add(o.id); c.push(o); } }));
    c.sort((a,b) => toMin(a.start) - toMin(b.start));
    if (c.length){
      msg = `<div class="msg bad">⚠ 고른 시간에 ${esc(roomName(form.room))}을(를) 이미 예약한 학급이 있어요<br>` +
        c.map(o => `· ${whoText(o)} ${esc(o.slotLabel)} ${o.start}~${o.end}${o.name?` (${esc(o.name)})`:""}`).join("<br>") +
        `<br><span style="font-weight:500">다른 교시를 고르거나, 해당 선생님과 협의 후 저장해 주세요.</span></div>`;
      $("saveBtn").textContent = "겹쳐도 저장";
    } else {
      msg = `<div class="msg good">✓ 고른 시간은 모두 비어 있어요</div>`;
      $("saveBtn").textContent = "저장";
    }
  } else $("saveBtn").textContent = "저장";
  $("fMsg").innerHTML = msg;
}

$("fRoom").onclick = e => { const b = e.target.closest("button"); if (b){ form.room = b.dataset.v; drawForm(); } };
$("fGrade").onclick = e => { const b = e.target.closest("button"); if (b){ form.grade = +b.dataset.v; drawForm(); } };
$("fSlot").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const v = b.dataset.v;
  form.slots = form.slots.includes(v) ? form.slots.filter(x => x !== v) : [...form.slots, v];
  drawForm();
};
$("fDate").onchange = e => { form.date = e.target.value; drawForm(); };
$("cancelBtn").onclick = closeForm;
$("overlay").onclick = e => { if (e.target.id === "overlay") closeForm(); };

$("saveBtn").onclick = async () => {
  form.cls = $("fCls").value.trim(); form.name = $("fName").value.trim(); form.memo = $("fMemo").value.trim();
  if (!form.room) return toast("특별실을 골라 주세요");
  if (!form.date) return toast("날짜를 골라 주세요");
  if (!hasGrade()) return toast("학년을 골라 주세요");
  if (!form.slots.length) return toast("교시를 하나 이상 골라 주세요");
  const hit = form.slots.some(sid => conflictsWith({ room:form.room, date:form.date, slot:sid }, editIds).length);
  const createdAt = editIds.length ? (data[editIds[0]]?.createdAt || Date.now()) : Date.now();
  const group = form.slots.length > 1 ? newId("g") : null;
  const recs = slotList().filter(s => form.slots.includes(s.id)).map(s => {
    const r = { room:form.room, date:form.date, grade:form.grade, slot:s.id, cls:form.cls, name:form.name, memo:form.memo, createdAt, updatedAt: Date.now() };
    if (group) r.group = group;
    return r;
  });
  try {
    await store.replace(editIds, recs);
    if (form.name) localStorage.setItem("tbs-name", form.name);
    closeForm();
    toast(hit ? "저장했어요 — 겹침이 표시됩니다" : "저장했어요");
    curRoom = form.room; curMon = mondayOf(parse(form.date)); render();
  } catch(e){ toast("저장하지 못했어요. 다시 로그인해 주세요."); }
};
$("delBtn").onclick = async () => {
  if (!editIds.length) return;
  const it = data[editIds[0]];
  const label = groupSlotLabel(editIds) || (slotById(it.slot)||{}).label || "";
  if (!confirm(`${gradeName(it.grade)}${it.cls?" "+it.cls:""} ${label} 예약을 삭제할까요?`)) return;
  try { await store.replace(editIds, []); closeForm(); toast("삭제했어요"); } catch(e){ toast("삭제하지 못했어요."); }
};

$("adminBtn").onclick = () => {
  if (adminPw) return openAdmin();
  $("aPw").value = ""; $("aErr").textContent = "";
  $("aLoginOv").classList.remove("hidden"); setTimeout(() => $("aPw").focus(), 50);
};

$("aLoginForm").onsubmit = async e => {

function countBy(key, val){ return Object.values(data).filter(v => v[key] === val).length; }
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

function drawAdmin(){
  const orph = orphans();
  $("aTabs").innerHTML = [["requests","요청사항"],["rooms","특별실 관리"],["slots","교시 시간 관리"],["orphans","정리할 예약"]].map(([k,t]) => {
    const n = k === "orphans" ? orph.length : k === "requests" ? reqList().filter(r => r.status !== "done").length : 0;
    return `<button class="atab ${aTab===k?"on":""}" data-t="${k}">${t}${n?`<span class="cnt">${n}</span>`:""}</button>`; }).join("");
  $("aSave").classList.toggle("hidden", aTab === "requests" || aTab === "orphans");
  $("aReset").classList.toggle("hidden", aTab !== "slots");

  if (aTab === "requests"){
    const list = reqList();
    $("aBody").innerHTML = `<p class="help">선생님들이 남긴 요청이에요. 상태를 바꾸거나 답변을 남기면 모든 선생님이 '요청하기' 화면에서 볼 수 있어요.</p>` +
      (list.length ? list.map(r => `<div class="req admin" data-rid="${r.id}">
        <div class="req-head"><span class="rtype">${esc(r.type)}</span><b>${esc(r.name || "이름 없음")}</b><span class="rdate">${fmtDT(r.createdAt)}</span><div class="spacer"></div>
          <div class="seg small">${Object.entries(REQ_STATUS).map(([k,v]) => `<button type="button" class="${r.status===k?"on st-"+k:""}" data-act="rstatus" data-v="${k}">${v}</button>`).join("")}</div></div>
        <div class="req-text">${esc(r.text)}</div>
        <div class="addrow" style="margin-top:8px"><input class="inp" data-reply value="${esc(r.reply||"")}" placeholder="답변 (선택)" maxlength="300" style="max-width:none">
          <button class="ibtn" data-act="rreply">답변 저장</button><button class="ibtn del" data-act="rdel">삭제</button></div>
      </div>`).join("") : `<div class="msg info">아직 들어온 요청이 없어요.</div>`);
  }

  if (aTab === "rooms"){
    const rooms = Object.entries(draft.rooms||{}).map(([id,r]) => ({id,...r})).sort((a,b) => (a.order??0)-(b.order??0));
    $("aBody").innerHTML = `<p class="help">이름을 바꾸거나 순서를 옮길 수 있어요. 특별실을 지우면 그 특별실의 예약은 '정리할 예약'으로 옮겨져요.</p>
      <table class="atable"><thead><tr><th style="width:70px">순서</th><th>특별실 이름</th><th style="width:120px">예약 수</th><th style="width:200px"></th></tr></thead><tbody>` +
      rooms.map((r,i) => `<tr data-id="${r.id}">
        <td>${i+1}</td>
        <td><input class="inp" data-f="name" value="${esc(r.name)}" maxlength="20"></td>
        <td>${countBy("room", r.id)}건</td>
        <td class="acts"><button class="ibtn" data-act="up" ${i===0?"disabled":""}>▲</button> <button class="ibtn" data-act="down" ${i===rooms.length-1?"disabled":""}>▼</button> <button class="ibtn del" data-act="del">삭제</button></td>
      </tr>`).join("") +
      `</tbody></table>
      <div class="addrow"><input class="inp" id="newRoom" placeholder="새 특별실 이름 (예: 과학실)" maxlength="20"><button class="btn btn-primary" id="addRoom">+ 특별실 추가</button></div>`;
  }

  if (aTab === "slots"){
    const slots = slotList(draft);
    $("aBody").innerHTML = `<p class="help">시작·끝 시각을 바꾸면 이미 들어간 예약도 새 시각으로 계산돼요. 시간표는 시작 시각 순서로 자동 정렬돼요. '사용 학년·요일'에서 그 교시가 있는 학년과 요일을 정해 주세요.</p>
      <table class="atable"><thead><tr><th style="width:110px">이름</th><th style="width:155px">시작</th><th style="width:155px">끝</th><th style="width:140px">대상 표시</th><th>메모</th><th>사용 학년·요일</th><th style="width:70px"></th></tr></thead><tbody>` +
      slots.map(s => `<tr data-id="${s.id}">
        <td><input class="inp" data-f="label" value="${esc(s.label)}" maxlength="20"></td>
        <td><input class="inp" type="time" data-f="start" value="${s.start}"></td>
        <td><input class="inp" type="time" data-f="end" value="${s.end}"></td>
        <td><input class="inp" data-f="who" value="${esc(s.who||"")}" placeholder="자동" maxlength="20"></td>
        <td><input class="inp" data-f="note" value="${esc(s.note||"")}" placeholder="예: 저학년 점심" maxlength="30"></td>
        <td><div class="avail-sum">${esc(availSummary(s))}</div><button class="ibtn" data-act="matrix" style="margin-top:4px">${openMatrix===s.id?"접기":"고치기"}</button></td>
        <td><button class="ibtn del" data-act="del">삭제</button></td>
      </tr>` + (openMatrix === s.id ? `<tr class="matrix-row" data-id="${s.id}"><td colspan="7">
        <table class="matrix"><thead><tr><th></th>${[1,2,3,4,5].map(d => `<th>${DOW[d]}</th>`).join("")}<th></th></tr></thead><tbody>` +
        GRADES.map(g => `<tr><th>${g}학년</th>${[1,2,3,4,5].map(d => {
          const on = String((s.avail||{})["g"+g]||"").includes(String(d));
          return `<td><button class="mbox ${on?"on":""}" data-act="cell" data-g="${g}" data-d="${d}">✓</button></td>`; }).join("")}
          <td><button class="ibtn" data-act="rowall" data-g="${g}">월~금</button> <button class="ibtn" data-act="rownone" data-g="${g}">비우기</button></td></tr>`).join("") +
        `</tbody></table></td></tr>` : "")).join("") +
      `</tbody></table>
      <div class="addrow"><button class="btn btn-primary" id="addSlot">+ 교시 추가</button></div>`;
  }

  if (aTab === "orphans"){
    $("aBody").innerHTML = `<p class="help">특별실이나 교시가 지워져서 시간표에 보이지 않는 예약이에요. 필요 없으면 지워 주세요.</p>` +
      (orph.length ? orph.sort((a,b) => a.date.localeCompare(b.date)).map(o => {
        const d = parse(o.date);
        return `<div class="orphan"><b>${md(d)}(${DOW[d.getDay()]})</b> ${esc(roomName(o.room))} · ${whoText(o)} · ${esc((slotById(o.slot)||{}).label || "(삭제된 교시)")}${o.name?` · ${esc(o.name)}`:""}<div class="spacer"></div><button class="ibtn del" data-act="delres" data-id="${o.id}">예약 삭제</button></div>`;
      }).join("") : `<div class="msg good">✓ 정리할 예약이 없어요</div>`);
  }
}

$("aTabs").onclick = e => { const b = e.target.closest(".atab"); if (b){ aTab = b.dataset.t; drawAdmin(); } };

// 입력값 바로 반영
$("aBody").oninput = e => {
  const inp = e.target.closest("[data-f]"); if (!inp || !draft) return;
  const id = inp.closest("tr[data-id]").dataset.id;
  const obj = aTab === "rooms" ? draft.rooms[id] : draft.slots[id];
  obj[inp.dataset.f] = inp.value;
};
$("aBody").onchange = e => { if (aTab === "slots" && e.target.type === "time") drawAdmin(); };

$("aBody").onclick = async e => {
  const t = e.target;
  if (t.id === "addRoom"){
    const name = $("newRoom").value.trim(); if (!name) return toast("특별실 이름을 적어 주세요");
    const max = Math.max(-1, ...Object.values(draft.rooms).map(r => r.order ?? 0));
    draft.rooms[newId("r")] = { name, order: max + 1 }; drawAdmin(); return;
  }
  if (t.id === "addSlot"){
    const last = slotList(draft).slice(-1)[0];
    const start = last ? last.end : "09:00";
    const endM = Math.min(toMin(start) + 40, 23*60+59);
    const id = newId("s");
    draft.slots[id] = { label:"새 교시", start, end:`${pad(Math.floor(endM/60))}:${pad(endM%60)}`, who:"", note:"", avail:{} };
    openMatrix = id; drawAdmin(); return;
  }
  const b = t.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act.startsWith("r") && b.closest("[data-rid]")){
    const box = b.closest("[data-rid]"), rid = box.dataset.rid;
    try {
      if (act === "rstatus") await store.adminSetRequest(rid, { status: b.dataset.v });
      if (act === "rreply"){ await store.adminSetRequest(rid, { reply: box.querySelector("[data-reply]").value.trim() }); toast("답변을 저장했어요"); }
      if (act === "rdel"){ if (!confirm("이 요청을 삭제할까요?")) return; await store.adminSetRequest(rid, null); toast("삭제했어요"); }
    } catch(err){ toast("저장하지 못했어요. 관리자 모드로 다시 들어와 주세요."); }
    drawAdmin(); return;
  }

  if (act === "delres"){
    if (!confirm("이 예약을 삭제할까요?")) return;
    try { await store.remove(b.dataset.id); toast("삭제했어요"); drawAdmin(); } catch(err){ toast("삭제하지 못했어요"); }
    return;
  }
  const id = b.closest("tr[data-id]").dataset.id;

  if (aTab === "rooms"){
    const rooms = Object.entries(draft.rooms).map(([k,r]) => ({k,...r})).sort((a,b) => (a.order??0)-(b.order??0));
    const i = rooms.findIndex(r => r.k === id);
    if (act === "up" || act === "down"){
      const j = act === "up" ? i-1 : i+1; [rooms[i], rooms[j]] = [rooms[j], rooms[i]];
      rooms.forEach((r,n) => draft.rooms[r.k].order = n);
    }
    if (act === "del"){
      if (rooms.length <= 1) return toast("특별실은 하나 이상 있어야 해요");
      const n = countBy("room", id);

      delete draft.rooms[id];
    }
  }

  if (aTab === "slots"){
    const s = draft.slots[id];
    if (act === "matrix") openMatrix = openMatrix === id ? null : id;
    if (act === "del"){
      const n = countBy("slot", id);
      if (!confirm(`'${s.label} ${s.start}~${s.end}'을(를) 지울까요?${n ? `\n이 교시 예약 ${n}건은 '정리할 예약'으로 옮겨져요.` : ""}`)) return;
      delete draft.slots[id];
    }
    const setDays = (g, str) => { s.avail ||= {}; if (str) s.avail["g"+g] = str; else delete s.avail["g"+g]; };
    if (act === "cell"){
      const g = b.dataset.g, d = b.dataset.d;
      const cur = new Set(String((s.avail||{})["g"+g]||"").split("").filter(Boolean));
      cur.has(d) ? cur.delete(d) : cur.add(d);
      setDays(g, [...cur].sort().join(""));
    }
    if (act === "rowall") setDays(b.dataset.g, ALL);
    if (act === "rownone") setDays(b.dataset.g, "");
  }
  drawAdmin();
};

// 날짜 알아듣기: 오늘/내일/모레, (다음주) 화요일, 11/17, 11월 17일
function parseDateQ(raw){
  const t = norm(raw), now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let m = raw.match(/(\d{1,2})\s*[\/.월]\s*(\d{1,2})/);
  if (m){ let y = today.getFullYear(); const d = new Date(y, +m[1]-1, +m[2]); if (d < addDays(today,-180)) d.setFullYear(y+1); return d; }
  if (t.includes("모레")) return addDays(today, 2);
  if (t.includes("내일")) return addDays(today, 1);
  if (t.includes("오늘")) return today;
  m = t.match(/(월|화|수|목|금)(요일|욜)/);
  if (m){ const w = "일월화수목금토".indexOf(m[1]); let base = mondayOf(today); if (t.includes("다음주")) base = addDays(base, 7); if (t.includes("지난주")) base = addDays(base, -7); return addDays(base, w - 1); }
  return null;
}
function parseRoomsQ(raw){
  const t = norm(raw);
  const found = roomList().filter(r => t.includes(norm(r.name)));
  return found.length ? found : roomList();
}
function dayStatusHTML(room, d){
  const date = fmt(d), dow = d.getDay();
  const head = `<b>${esc(room.name)} · ${md(d)}(${DOW[dow]})</b>`;
  if (dow === 0 || dow === 6) return `${head}<br>주말이라 수업이 없어요.`;
  const items = dayItems(room.id, date);
  const bad = new Set(); conflictGroups(items).forEach(g => g.items.forEach(i => bad.add(i.id)));
  const rows = slotList().map(s => {
    const here = items.filter(i => i.slot === s.id);
    const allowed = gradesFor(s.id, dow);
    if (!allowed.length && !here.length) return "";
    const val = here.length
      ? here.map(i => `<span class="${bad.has(i.id)?"bad":"busy"}">${bad.has(i.id)?"⚠ ":""}${whoText(i)}</span>`).join(", ")
      : `<span class="free">비어 있음</span>`;
    return `<tr><td>${esc(s.label)}</td><td>${s.start}~${s.end}</td><td>${val}</td></tr>`;
  }).join("");
  return `${head}<table>${rows}</table><button class="act" data-bot="reserve" data-date="${date}" data-room="${room.id}">이 날 예약하기</button>`;
}
function weekConflictHTML(mon){
  const parts = roomList().map(r => {
    const cf = weekConflicts(r.id, mon);
    if (!cf.length) return "";
    return `<b>${esc(r.name)}</b><ul>` + cf.map(c => { const d = parse(c.date);
      return `<li>${md(d)}(${DOW[d.getDay()]}) — ${c.items.map(i => `${whoText(i)} ${esc(i.slotLabel)}`).join(", ")}</li>`; }).join("") + `</ul>`;
  }).join("");
  return parts ? `이번 주(${md(mon)}~${md(addDays(mon,4))}) <span class="bad">겹치는 예약</span>이에요.<br>${parts}해당 선생님끼리 협의해서 한쪽을 다른 교시로 옮겨 주세요.`
               : `이번 주(${md(mon)}~${md(addDays(mon,4))})에는 <span class="free">겹치는 예약이 없어요.</span> 👍`;
}

  if (has(t, ["안녕","하이","hello","hi"])) return `안녕하세요, 선생님! 특별실 예약 사용법이나 예약 현황을 물어보세요. 아래 버튼을 눌러도 돼요.`;
  if (has(t, ["고마","감사","땡큐"])) return `천만에요! 더 궁금한 게 있으면 언제든 물어보세요.`;

  // 예약 현황 질문: 날짜가 있고 (비었/현황/누가/사용/예약 등)
  const d = parseDateQ(raw);
  if (d && !has(t, ["어떻게","방법","하는법"])){
    if (has(t, ["겹"])){ return weekConflictHTML(mondayOf(d)); }
    return parseRoomsQ(raw).map(r => dayStatusHTML(r, d)).join("<br><br>");
  }
  if (has(t, ["비어","빈시간","빈교시","비었","현황","누가","언제"])){
    const today = new Date(), wd = today.getDay();
    const day = (wd === 0 || wd === 6) ? mondayOf(addDays(today, 7)) : today;
    return parseRoomsQ(raw).map(r => dayStatusHTML(r, day)).join("<br><br>") +
      `<br><br><span style="color:var(--ink-3);font-size:14px">다른 날은 "내일 강당", "다음주 화요일 컴퓨터실", "11/20"처럼 물어보세요.</span>`;
  }
  if (has(t, ["이번주겹","겹침확인","겹치는거있","겹치는예약있"])) return weekConflictHTML(mondayOf(new Date()));

  let best = null, score = 0;
  INTENTS.forEach(it => { const n = it.keys.filter(k => t.includes(k)).length * (it.w || 1); if (n > score){ score = n; best = it; } });
  if (best) return best.a();
  return `음, 그 질문은 아직 잘 모르겠어요. 😅<br>아래 버튼에서 골라 보시거나, 따로 알려 주실 내용이 있으면 요청으로 남겨 주세요.<br><button class="act" data-bot="req" data-text="${esc(raw)}">이 내용으로 요청 남기기</button>`;
}

function chatPush(html, who){
  const div = document.createElement("div");
  div.className = `bubble ${who}`; div.innerHTML = html;
  $("chatLog").appendChild(div); $("chatLog").scrollTop = $("chatLog").scrollHeight;
}
function ask(text){
  chatPush(esc(text), "me");
  setTimeout(() => chatPush(botAnswer(text), "bot"), 250);
}
let chatStarted = false;
function openChat(){
  $("chat").classList.remove("hidden"); $("chatFab").classList.add("hidden");
  if (!chatStarted){
    chatStarted = true;
    $("chatQuick").innerHTML = QUICK.map(q => `<button type="button">${q}</button>`).join("");
    chatPush(`안녕하세요! <b>특별실 예약 사용 도우미</b>예요.<br>사용법을 물어보시거나, "<b>오늘 컴퓨터실 비어 있어?</b>", "<b>다음주 화요일 강당</b>"처럼 예약 현황을 물어보세요.`, "bot");
  }
  setTimeout(() => $("chatIn").focus(), 50);
}
$("chatFab").onclick = openChat;
$("chatClose").onclick = () => { $("chat").classList.add("hidden"); $("chatFab").classList.remove("hidden"); };
$("chatForm").onsubmit = e => { e.preventDefault(); const v = $("chatIn").value.trim(); if (!v) return; $("chatIn").value = ""; ask(v); };
$("chatQuick").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const q = b.textContent;
  if (q === "요청 남기기") return ask("요청을 남기고 싶어요");
  if (q === "오늘 비어 있는 시간") return ask("오늘 비어 있는 시간");
  if (q === "이번 주 겹침 확인") return ask("이번 주 겹침 확인");
  if (q === "교시 시간표") return ask("교시 시간표 알려줘");
  if (q === "수정·삭제") return ask("예약 수정이나 삭제는 어떻게 해요?");
  ask(q);
};
$("chatLog").onclick = e => {
  const b = e.target.closest("[data-bot]"); if (!b) return;
  if (b.dataset.bot === "req") openReq({ type: b.dataset.type, text: b.dataset.text });
  if (b.dataset.bot === "reserve"){
    const preset = {};
    if (b.dataset.date){ preset.date = b.dataset.date; curMon = mondayOf(parse(b.dataset.date)); }
    if (b.dataset.room){ preset.room = b.dataset.room; curRoom = b.dataset.room; }
    render(); openForm(preset);
  }
};

/* ════════════════════════════════════════════════
   10) 로그인
   ════════════════════════════════════════════════ */
async function enter(pw){
  $("loginErr").textContent = "확인 중…";
  const ok = await store.login(pw);
  if (!ok){ $("loginErr").textContent = "비밀번호가 맞지 않아요"; sessionStorage.removeItem("tbs-pw"); return; }
  sessionStorage.setItem("tbs-pw", pw);
  $("loginErr").textContent = "";
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("demoBadge").classList.toggle("hidden", !DEMO);
  $("chatFab").classList.remove("hidden");
  store.listen(render);
  render();
}
$("loginForm").onsubmit = e => { e.preventDefault(); enter($("pw").value.trim()); };
$("logoutBtn").onclick = () => { sessionStorage.removeItem("tbs-pw"); unsubs.forEach(f => f()); location.reload(); };
const saved = sessionStorage.getItem("tbs-pw"); if (saved) enter(saved);
</script>
