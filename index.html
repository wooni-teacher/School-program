<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반월초 특별실 예약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ───── 글씨체: 국어 앱과 맞추려면 이 두 줄만 바꾸면 됩니다 ───── */
  :root{
    --font-title: 'Gowun Batang', 'Noto Serif KR', serif;
    --font-body: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

    --bg:#f6f4ef; --paper:#ffffff; --ink:#1f2328; --ink-2:#4a5058; --ink-3:#7a8089;
    --line:#dcd8cf; --line-2:#ebe8e1; --accent:#2b4c7e; --accent-soft:#e8eef7;
    --danger:#c62828; --danger-soft:#fdecec; --ok:#2e7d32; --none:#f0eee9;
    --g1:#2e7d32; --g1s:#e7f4e8;  --g2:#00796b; --g2s:#e0f2f0;
    --g3:#b26a00; --g3s:#fff3dc;  --g4:#c2410c; --g4s:#ffeadf;
    --g5:#1d4ed8; --g5s:#e5edff;  --g6:#6d28d9; --g6s:#f0e8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}

  /* 로그인 */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:44px 40px;width:100%;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.05)}
  .login-card .school{font-size:15px;color:var(--ink-3);letter-spacing:.15em}
  .login-card h1{font-family:var(--font-title);font-size:34px;margin:8px 0 6px}
  .login-card p{color:var(--ink-2);margin:0 0 28px}
  .login-card input{width:100%;padding:16px;border:2px solid var(--line);border-radius:12px;font-size:20px;text-align:center;letter-spacing:.2em;outline:none}
  .login-card input:focus{border-color:var(--accent)}
  .login-card .btn-primary{width:100%;margin-top:14px;padding:16px;font-size:19px}
  .login-err{color:var(--danger);font-weight:600;min-height:26px;margin-top:12px}

  /* 공통 버튼 */
  .btn{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600}
  .btn:hover{border-color:var(--ink-3)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;border-radius:12px;font-weight:700}
  .btn-primary:hover{filter:brightness(1.08);border-color:var(--accent)}
  .btn-danger{background:var(--paper);border-color:var(--danger);color:var(--danger)}

  /* 헤더 */
  header{background:var(--paper);border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-family:var(--font-title);font-size:28px;margin:0}
  header .sub{color:var(--ink-3);font-size:15px}
  header .spacer{flex:1}
  .demo-badge{background:#fff3dc;color:#8a5300;border:1px solid #f0d199;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}

  main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}

  /* 툴바 */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .tabs{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:5px;gap:4px}
  .tab{border:none;background:transparent;padding:12px 26px;border-radius:10px;font-size:19px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .tab.on{background:var(--accent);color:#fff}
  .tab .cnt{background:var(--danger);color:#fff;border-radius:999px;font-size:13px;padding:1px 8px;font-weight:700}
  .weeknav{display:flex;align-items:center;gap:8px;margin-left:auto}
  .weeknav .label{font-family:var(--font-title);font-size:21px;font-weight:700;min-width:250px;text-align:center}
  .weeknav .btn{padding:10px 14px}

  /* 겹침 알림 */
  .alert{background:var(--danger-soft);border:2px solid var(--danger);border-radius:14px;padding:14px 18px;margin-bottom:16px}
  .alert h3{margin:0 0 6px;color:var(--danger);font-size:18px}
  .alert ul{margin:0;padding-left:20px}
  .alert li{margin:3px 0;cursor:pointer}
  .alert li:hover{text-decoration:underline}
  .okbar{background:#eef7ee;border:1.5px solid #b9dcbb;color:var(--ok);border-radius:14px;padding:12px 18px;margin-bottom:16px;font-weight:600}

  /* 시간표 */
  .grid-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px}
  table.grid{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
  .grid th,.grid td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);vertical-align:top}
  .grid tr>*:last-child{border-right:none}
  .grid thead th{background:#faf9f6;padding:14px 8px;font-size:18px;font-weight:700;border-bottom:2px solid var(--line)}
  .grid thead th .d{display:block;font-size:14px;color:var(--ink-3);font-weight:500}
  .grid thead th.today{background:var(--accent-soft);color:var(--accent)}
  .grid thead th.today .d{color:var(--accent)}
  .grid th.slot{width:160px;text-align:left;padding:12px 14px;background:#faf9f6}
  .slot b{font-size:19px;display:block}
  .slot .t{font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .slot .w{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
  .slot .w.low{background:var(--g1s);color:var(--g1)}
  .slot .w.high{background:var(--g5s);color:var(--g5)}
  .slot .n{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px}
  tr.lunch-row th.slot{background:#f7f5ef}
  td.cell{padding:8px;height:92px;cursor:pointer;transition:background .12s;position:relative}
  td.cell:hover{background:#fbfaf7}
  td.cell.today{background:#f7f9fd}
  td.cell .hint{color:#b5b1a8;font-size:13.5px;position:absolute;inset:auto 10px 8px auto}
  td.cell .plus{display:none;position:absolute;right:10px;top:8px;color:var(--accent);font-weight:800;font-size:20px}
  td.cell:hover .plus{display:block}
  td.cell.none{background:repeating-linear-gradient(135deg,var(--none) 0 8px,#f6f4ef 8px 16px);cursor:default}
  td.cell.none .hint{position:static;display:block;text-align:center;margin-top:26px;color:#a8a399}
  td.cell.conflict{background:var(--danger-soft);box-shadow:inset 0 0 0 3px var(--danger)}
  td.cell.conflict .warn{display:block;color:var(--danger);font-weight:800;font-size:14px;margin-bottom:4px}
  td.cell.flash{animation:flash 1.2s ease 2}
  @keyframes flash{50%{box-shadow:inset 0 0 0 5px var(--danger);background:#ffd6d6}}

  .chip{display:block;border-radius:9px;padding:7px 10px;margin-bottom:6px;border-left:5px solid;font-weight:700;font-size:17px;line-height:1.3;cursor:pointer}
  .chip small{display:block;font-weight:500;font-size:13.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip:hover{filter:brightness(.96)}
  .gc1{background:var(--g1s);border-color:var(--g1);color:#1b4d1e}
  .gc2{background:var(--g2s);border-color:var(--g2);color:#00463e}
  .gc3{background:var(--g3s);border-color:var(--g3);color:#6b4000}
  .gc4{background:var(--g4s);border-color:var(--g4);color:#7c2a08}
  .gc5{background:var(--g5s);border-color:var(--g5);color:#132f86}
  .gc6{background:var(--g6s);border-color:var(--g6);color:#43188a}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--ink-2);font-size:15px;align-items:center}
  .legend .dot{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

  /* 모달 */
  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50}
  .modal{background:var(--paper);border-radius:18px;width:100%;max-width:620px;padding:28px 28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal h2{font-family:var(--font-title);font-size:26px;margin:0 0 18px}
  .field{margin-bottom:18px}
  .field>label{display:block;font-weight:700;margin-bottom:8px;font-size:16px}
  .field>label .opt{color:var(--ink-3);font-weight:500;font-size:14px}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:700;font-size:17px;min-width:64px}
  .seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
  .seg button:disabled{opacity:.35;cursor:not-allowed}
  .seg.slots button{text-align:left;line-height:1.25}
  .seg.slots button small{display:block;font-weight:500;font-size:13px;opacity:.85}
  .seg.grades button.on.g1{background:var(--g1);border-color:var(--g1)} .seg.grades button.on.g2{background:var(--g2);border-color:var(--g2)}
  .seg.grades button.on.g3{background:var(--g3);border-color:var(--g3)} .seg.grades button.on.g4{background:var(--g4);border-color:var(--g4)}
  .seg.grades button.on.g5{background:var(--g5);border-color:var(--g5)} .seg.grades button.on.g6{background:var(--g6);border-color:var(--g6)}
  .inp{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;font-size:17px;outline:none;background:#fff}
  .inp:focus{border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .msg{border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:16px}
  .msg.bad{background:var(--danger-soft);color:var(--danger);border:2px solid var(--danger)}
  .msg.good{background:#eef7ee;color:var(--ok);border:1.5px solid #b9dcbb}
  .msg.info{background:#f3f2ee;color:var(--ink-2)}
  .modal-actions{display:flex;gap:10px;align-items:center;margin-top:6px}
  .modal-actions .spacer{flex:1}
  .modal-actions .btn{padding:12px 20px;font-size:17px}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#22262c;color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  @media (max-width:720px){
    header{padding:14px 16px} header h1{font-size:23px}
    .weeknav{margin-left:0;width:100%;justify-content:space-between}
    .weeknav .label{min-width:0;font-size:17px}
    .tab{padding:10px 18px;font-size:17px}
    .row2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- 로그인 -->
<section id="login">
  <div class="login-card">
    <div class="school">반월초등학교</div>
    <h1>특별실 예약</h1>
    <p>컴퓨터실 · 강당 사용 일정을 함께 확인해요</p>
    <form id="loginForm">
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autofocus>
      <button class="btn btn-primary" type="submit">들어가기</button>
    </form>
    <div class="login-err" id="loginErr"></div>
  </div>
</section>

<!-- 본 화면 -->
<section id="app" class="hidden">
  <header>
    <div>
      <h1>특별실 예약</h1>
      <div class="sub">반월초등학교 교직원 공유</div>
    </div>
    <span class="demo-badge hidden" id="demoBadge">미리보기 모드 · 이 기기에만 저장</span>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="newBtn" style="padding:12px 20px;font-size:17px">+ 예약하기</button>
    <button class="btn" id="logoutBtn">나가기</button>
  </header>

  <main>
    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <div class="weeknav">
        <button class="btn" id="prevW">◀ 이전 주</button>
        <div class="label" id="weekLabel"></div>
        <button class="btn" id="nextW">다음 주 ▶</button>
        <button class="btn" id="thisW">이번 주</button>
      </div>
    </div>

    <div id="alertBox"></div>

    <div class="grid-wrap"><table class="grid" id="grid"></table></div>

    <div class="legend">
      <span><span class="dot" style="background:var(--g1)"></span>1학년</span>
      <span><span class="dot" style="background:var(--g2)"></span>2학년</span>
      <span><span class="dot" style="background:var(--g3)"></span>3학년</span>
      <span><span class="dot" style="background:var(--g4)"></span>4학년</span>
      <span><span class="dot" style="background:var(--g5)"></span>5학년</span>
      <span><span class="dot" style="background:var(--g6)"></span>6학년</span>
      <span><span class="dot" style="background:var(--danger-soft);box-shadow:inset 0 0 0 2px var(--danger)"></span>시간 겹침</span>
      <span><span class="dot" style="background:repeating-linear-gradient(135deg,#e4e1da 0 3px,#f6f4ef 3px 6px)"></span>수업 없음</span>
      <span style="margin-left:auto">빈칸을 누르면 바로 예약, 예약을 누르면 수정·삭제</span>
    </div>
  </main>
</section>

<!-- 예약 입력 모달 -->
<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="mTitle">예약하기</h2>

    <div class="field">
      <label>특별실</label>
      <div class="seg" id="fRoom"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="fDate">날짜</label>
        <input type="date" id="fDate" class="inp">
      </div>
      <div class="field">
        <label for="fCls">반 <span class="opt">(선택)</span></label>
        <input id="fCls" class="inp" placeholder="예: 2반" maxlength="10">
      </div>
    </div>

    <div class="field">
      <label>학년</label>
      <div class="seg grades" id="fGrade"></div>
    </div>

    <div class="field">
      <label>교시</label>
      <div class="seg slots" id="fSlot"></div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="fName">신청 선생님 <span class="opt">(선택)</span></label>
        <input id="fName" class="inp" placeholder="예: 신동운" maxlength="20">
      </div>
      <div class="field">
        <label for="fMemo">메모 <span class="opt">(선택)</span></label>
        <input id="fMemo" class="inp" placeholder="예: 코딩 수업" maxlength="100">
      </div>
    </div>

    <div id="fMsg"></div>

    <div class="modal-actions">
      <button class="btn btn-danger hidden" id="delBtn">삭제</button>
      <div class="spacer"></div>
      <button class="btn" id="cancelBtn">취소</button>
      <button class="btn btn-primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ════════════════════════════════════════════════
   1) Firebase 설정 — 'school' 프로젝트의 웹 앱 설정값을 붙여넣으세요.
      값이 비어 있으면 '미리보기 모드'로 이 기기에만 저장됩니다.
   ════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyDPg8nclz-OoVhUMAcJuMoPvvQBOeHN4Hg",
  authDomain: "school-b5828.firebaseapp.com",
  // ⚠ Realtime Database 데이터 탭 맨 위 주소와 같은지 확인하세요 (미국 지역이면 https://school-b5828-default-rtdb.firebaseio.com)
  databaseURL: "https://school-b5828-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "school-b5828",
  storageBucket: "school-b5828.firebasestorage.app",
  messagingSenderId: "229836109104",
  appId: "1:229836109104:web:9c3215ea4d9435612cc4f5"
};
const ROOT = "teukbyeolsil";   // DB 최상위 경로 (규칙 파일과 같아야 함)

/* ════════════════════════════════════════════════
   2) 학교 시간표
   ════════════════════════════════════════════════ */
const ROOMS = [
  { id: "computer", name: "컴퓨터실" },
  { id: "hall",     name: "강당" }
];
// 실제 시간 순서대로 나열. 같은 줄 = 같은 시간대 → 같은 칸에 두 개 이상이면 겹침
const SLOTS = [
  { id:"p1",  label:"1교시", start:"09:00", end:"09:40", who:"전 학년" },
  { id:"p2",  label:"2교시", start:"09:50", end:"10:30", who:"전 학년" },
  { id:"p3",  label:"3교시", start:"10:40", end:"11:20", who:"전 학년" },
  { id:"p4h", label:"4교시", start:"11:30", end:"12:10", who:"고학년", cls:"high", note:"저학년 점심시간" },
  { id:"p4l", label:"4교시", start:"12:10", end:"12:50", who:"저학년", cls:"low",  note:"고학년 점심시간", lunch:true },
  { id:"p5",  label:"5교시", start:"13:00", end:"13:40", who:"전 학년 공통" },
  { id:"p6",  label:"6교시", start:"13:50", end:"14:30", who:"고학년", cls:"high" }
];
const DOW = ["일","월","화","수","목","금","토"];

// 해당 학년이 그 요일에 쓸 수 있는 교시
function slotsFor(grade, dow){
  if (dow < 1 || dow > 5) return [];
  if (grade <= 2){                                  // 저학년
    const s = ["p1","p2","p3","p4l"];
    if ([2,3,4].includes(dow)) s.push("p5");        // 5교시: 화·수·목
    return s;
  }
  const s = ["p1","p2","p3","p4h","p5"];           // 고학년
  if ((grade === 3 || grade === 4) && dow === 2) s.push("p6");          // 3·4학년 6교시: 화
  if ((grade === 5 || grade === 6) && [1,2,4,5].includes(dow)) s.push("p6"); // 5·6학년: 월·화·목·금
  return s;
}
function gradesFor(slotId, dow){
  return [1,2,3,4,5,6].filter(g => slotsFor(g, dow).includes(slotId));
}
function gradeRangeText(gs){
  if (!gs.length) return "";
  if (gs.length === 6) return "";
  const contiguous = gs.every((g,i) => i === 0 || g === gs[i-1] + 1);
  if (contiguous && gs.length > 2) return `${gs[0]}~${gs[gs.length-1]}학년`;
  return gs.join("·") + "학년";
}
const slotById = id => SLOTS.find(s => s.id === id);
const roomName = id => (ROOMS.find(r => r.id === id) || {}).name || id;
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const overlap = (a,b) => toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);

/* ════════════════════════════════════════════════
   3) 날짜 도우미
   ════════════════════════════════════════════════ */
const pad = n => String(n).padStart(2,"0");
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = x.getDay(); x.setDate(x.getDate() + (w === 0 ? -6 : 1 - w)); return x; }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
function weekOfMonthLabel(mon){
  // 그 주의 목요일이 속한 달 기준
  const thu = addDays(mon, 3);
  const first = new Date(thu.getFullYear(), thu.getMonth(), 1);
  const firstThu = addDays(first, (4 - first.getDay() + 7) % 7);
  const n = Math.floor((thu - firstThu) / (7*864e5)) + 1;
  return `${thu.getMonth()+1}월 ${n}주`;
}

/* ════════════════════════════════════════════════
   4) 저장소 (Firebase / 미리보기)
   ════════════════════════════════════════════════ */
const DEMO = !firebaseConfig.apiKey || !firebaseConfig.databaseURL;
let ref = null, data = {}, unsub = null;

const store = {
  async login(pw){
    if (DEMO) return true;
    if (!pw || /[.#$\[\]\/]/.test(pw)) return false;
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const r = firebase.database().ref(`${ROOT}/${pw}/reservations`);
    try { await r.limitToFirst(1).once("value"); ref = r; return true; }
    catch(e){ return false; }   // 규칙에서 막힘 = 비밀번호 틀림
  },
  listen(cb){
    if (DEMO){
      const load = () => { try { data = JSON.parse(localStorage.getItem("tbs-demo") || "{}"); } catch(e){ data = {}; } cb(); };
      load(); window.addEventListener("storage", load);
      unsub = () => window.removeEventListener("storage", load);
      return;
    }
    const h = ref.on("value", s => { data = s.val() || {}; cb(); },
      e => toast("연결이 끊겼어요. 다시 로그인해 주세요."));
    unsub = () => ref.off("value", h);
  },
  _saveDemo(){ localStorage.setItem("tbs-demo", JSON.stringify(data)); render(); },
  async add(obj){
    if (DEMO){ data["d"+Date.now()] = obj; return this._saveDemo(); }
    await ref.push(obj);
  },
  async update(id,obj){
    if (DEMO){ data[id] = obj; return this._saveDemo(); }
    await ref.child(id).set(obj);
  },
  async remove(id){
    if (DEMO){ delete data[id]; return this._saveDemo(); }
    await ref.child(id).remove();
  }
};

/* ════════════════════════════════════════════════
   5) 겹침 찾기
   ════════════════════════════════════════════════ */
function itemsOf(room, date){
  return Object.entries(data)
    .filter(([,v]) => v.room === room && v.date === date)
    .map(([id,v]) => ({ id, ...v, ...pick(slotById(v.slot)) }))
    .sort((a,b) => a.grade - b.grade);
}
const pick = s => s ? { start:s.start, end:s.end } : { start:"00:00", end:"00:00" };
function conflictsWith(rec, exceptId){
  const s = slotById(rec.slot); if (!s) return [];
  return itemsOf(rec.room, rec.date).filter(o => o.id !== exceptId && overlap(o, s));
}
function weekConflicts(room, mon){
  const out = [];
  for (let i=0;i<5;i++){
    const date = fmt(addDays(mon,i));
    const items = itemsOf(room, date);
    SLOTS.forEach(s => {
      const hit = items.filter(it => overlap(it, s));
      if (hit.length >= 2) out.push({ date, slot:s, items:hit });
    });
  }
  return out;
}

/* ════════════════════════════════════════════════
   6) 화면 그리기
   ════════════════════════════════════════════════ */
let curRoom = "computer";
let curMon = mondayOf(new Date());
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const whoText = it => `${it.grade}학년${it.cls ? " " + esc(it.cls) : ""}`;

function render(){
  // 탭
  $("tabs").innerHTML = ROOMS.map(r => {
    const n = weekConflicts(r.id, curMon).length;
    return `<button class="tab ${r.id===curRoom?"on":""}" data-room="${r.id}">${r.name}${n?`<span class="cnt">겹침 ${n}</span>`:""}</button>`;
  }).join("");

  // 주 표시
  const fri = addDays(curMon, 4);
  $("weekLabel").textContent = `${curMon.getFullYear()}년 ${weekOfMonthLabel(curMon)} (${md(curMon)}~${md(fri)})`;

  // 표
  const today = fmt(new Date());
  const days = [0,1,2,3,4].map(i => addDays(curMon, i));
  let h = `<thead><tr><th class="slot">시간</th>` + days.map(d =>
    `<th class="${fmt(d)===today?"today":""}">${DOW[d.getDay()]}요일<span class="d">${md(d)}${fmt(d)===today?" · 오늘":""}</span></th>`
  ).join("") + `</tr></thead><tbody>`;

  SLOTS.forEach(s => {
    h += `<tr class="${s.lunch?"lunch-row":""}"><th class="slot"><b>${s.label}</b><span class="t">${s.start} ~ ${s.end}</span><br><span class="w ${s.cls||""}">${s.who}</span>${s.note?`<span class="n">${s.note}</span>`:""}</th>`;
    days.forEach(d => {
      const date = fmt(d), dow = d.getDay();
      const allowed = gradesFor(s.id, dow);
      const items = itemsOf(curRoom, date).filter(it => overlap(it, s));
      const isToday = date === today;
      if (!allowed.length && !items.length){
        h += `<td class="cell none"><span class="hint">수업 없음</span></td>`; return;
      }
      const conflict = items.length >= 2;
      h += `<td class="cell ${conflict?"conflict":""} ${isToday?"today":""}" data-date="${date}" data-slot="${s.id}">`;
      if (conflict) h += `<span class="warn">⚠ ${items.length}개 학급 겹침</span>`;
      items.forEach(it => {
        const sub = [it.name, it.memo].filter(Boolean).map(esc).join(" · ");
        h += `<span class="chip gc${it.grade}" data-id="${it.id}">${whoText(it)}${sub?`<small>${sub}</small>`:""}</span>`;
      });
      if (!items.length) h += `<span class="hint">${gradeRangeText(allowed)}</span>`;
      h += `<span class="plus">+</span></td>`;
    });
    h += `</tr>`;
  });
  $("grid").innerHTML = h + `</tbody>`;

  // 겹침 알림
  const cf = weekConflicts(curRoom, curMon);
  if (cf.length){
    $("alertBox").innerHTML = `<div class="alert"><h3>⚠ ${roomName(curRoom)} — 이번 주 시간이 겹치는 예약 ${cf.length}건</h3><ul>` +
      cf.map(c => { const d = parse(c.date);
        return `<li data-date="${c.date}" data-slot="${c.slot.id}"><b>${md(d)}(${DOW[d.getDay()]}) ${c.slot.label} ${c.slot.start}~${c.slot.end}</b> — ${c.items.map(whoText).join(", ")}</li>`; }).join("") +
      `</ul></div>`;
  } else {
    const any = days.some(d => itemsOf(curRoom, fmt(d)).length);
    $("alertBox").innerHTML = any ? `<div class="okbar">✓ ${roomName(curRoom)} — 이번 주는 겹치는 예약이 없어요</div>` : "";
  }
}

/* ════════════════════════════════════════════════
   7) 예약 입력창
   ════════════════════════════════════════════════ */
let form = {}, editId = null;

function openForm(preset = {}, id = null){
  editId = id;
  form = { room: curRoom, date: "", grade: null, slot: null, cls:"", name:"", memo:"", ...preset };
  if (!form.date){ const t = new Date(); const d = (t.getDay()===0||t.getDay()===6) ? addDays(mondayOf(t),7) : t; form.date = fmt(d); }
  if (!id) form.name = form.name || localStorage.getItem("tbs-name") || "";
  $("mTitle").textContent = id ? "예약 수정" : "예약하기";
  $("delBtn").classList.toggle("hidden", !id);
  $("fDate").value = form.date; $("fCls").value = form.cls || ""; $("fName").value = form.name || ""; $("fMemo").value = form.memo || "";
  drawForm();
  $("overlay").classList.remove("hidden");
}
function closeForm(){ $("overlay").classList.add("hidden"); }

function drawForm(){
  $("fRoom").innerHTML = ROOMS.map(r => `<button type="button" class="${form.room===r.id?"on":""}" data-v="${r.id}">${r.name}</button>`).join("");
  $("fGrade").innerHTML = [1,2,3,4,5,6].map(g => `<button type="button" class="g${g} ${form.grade===g?"on":""}" data-v="${g}">${g}학년</button>`).join("");

  const dow = form.date ? parse(form.date).getDay() : -1;
  const avail = form.grade ? slotsFor(form.grade, dow) : [];
  if (form.grade && form.slot && !avail.includes(form.slot)) form.slot = null;
  if (!form.grade){
    $("fSlot").innerHTML = `<div class="msg info" style="margin:0">학년을 먼저 골라 주세요. 학년·요일에 맞는 교시만 보여요.</div>`;
  } else if (!avail.length){
    $("fSlot").innerHTML = `<div class="msg info" style="margin:0">주말에는 예약할 수 없어요.</div>`;
  } else {
    $("fSlot").innerHTML = SLOTS.filter(s => avail.includes(s.id)).map(s =>
      `<button type="button" class="${form.slot===s.id?"on":""}" data-v="${s.id}">${s.label}<small>${s.start}~${s.end}</small></button>`).join("");
  }

  // 겹침 실시간 확인
  let msg = "";
  if (form.grade && form.slot && form.date){
    const c = conflictsWith(form, editId);
    const s = slotById(form.slot);
    if (c.length){
      msg = `<div class="msg bad">⚠ 같은 시간(${s.start}~${s.end})에 ${roomName(form.room)}을(를) 이미 예약한 학급이 있어요<br>` +
        c.map(o => `· ${whoText(o)} ${o.label||slotById(o.slot).label}${o.name?` (${esc(o.name)})`:""}`).join("<br>") +
        `<br><span style="font-weight:500">다른 교시를 고르거나, 해당 선생님과 협의 후 저장해 주세요.</span></div>`;
      $("saveBtn").textContent = "겹쳐도 저장";
    } else {
      msg = `<div class="msg good">✓ 이 시간은 비어 있어요</div>`;
      $("saveBtn").textContent = "저장";
    }
  } else $("saveBtn").textContent = "저장";
  $("fMsg").innerHTML = msg;
}

$("fRoom").onclick = e => { const b = e.target.closest("button"); if (b){ form.room = b.dataset.v; drawForm(); } };
$("fGrade").onclick = e => { const b = e.target.closest("button"); if (b){ form.grade = +b.dataset.v; drawForm(); } };
$("fSlot").onclick = e => { const b = e.target.closest("button"); if (b){ form.slot = b.dataset.v; drawForm(); } };
$("fDate").onchange = e => { form.date = e.target.value; drawForm(); };
$("cancelBtn").onclick = closeForm;
$("overlay").onclick = e => { if (e.target.id === "overlay") closeForm(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeForm(); });

$("saveBtn").onclick = async () => {
  form.cls = $("fCls").value.trim(); form.name = $("fName").value.trim(); form.memo = $("fMemo").value.trim();
  if (!form.date){ return toast("날짜를 골라 주세요"); }
  if (!form.grade){ return toast("학년을 골라 주세요"); }
  if (!form.slot){ return toast("교시를 골라 주세요"); }
  const rec = { room:form.room, date:form.date, grade:form.grade, slot:form.slot,
    cls:form.cls, name:form.name, memo:form.memo,
    createdAt: editId ? (data[editId]?.createdAt || Date.now()) : Date.now(), updatedAt: Date.now() };
  try {
    if (editId) await store.update(editId, rec); else await store.add(rec);
    if (form.name) localStorage.setItem("tbs-name", form.name);
    closeForm();
    const c = conflictsWith(rec, editId);
    toast(c.length ? "저장했어요 — 겹침이 표시됩니다" : "저장했어요");
    curRoom = rec.room; curMon = mondayOf(parse(rec.date)); render();
  } catch(e){ toast("저장하지 못했어요. 다시 로그인해 주세요."); }
};
$("delBtn").onclick = async () => {
  if (!editId) return;
  const it = data[editId];
  if (!confirm(`${it.grade}학년${it.cls?" "+it.cls:""} ${slotById(it.slot).label} 예약을 삭제할까요?`)) return;
  try { await store.remove(editId); closeForm(); toast("삭제했어요"); } catch(e){ toast("삭제하지 못했어요."); }
};

/* ════════════════════════════════════════════════
   8) 화면 조작
   ════════════════════════════════════════════════ */
$("tabs").onclick = e => { const b = e.target.closest(".tab"); if (b){ curRoom = b.dataset.room; render(); } };
$("prevW").onclick = () => { curMon = addDays(curMon,-7); render(); };
$("nextW").onclick = () => { curMon = addDays(curMon, 7); render(); };
$("thisW").onclick = () => { curMon = mondayOf(new Date()); render(); };
$("newBtn").onclick = () => openForm();

$("grid").onclick = e => {
  const chip = e.target.closest(".chip");
  if (chip){ const v = data[chip.dataset.id]; if (v) openForm({ ...v }, chip.dataset.id); return; }
  const td = e.target.closest("td.cell");
  if (td && !td.classList.contains("none")){
    const dow = parse(td.dataset.date).getDay();
    const allowed = gradesFor(td.dataset.slot, dow);
    // 저학년 전용/고학년 전용 칸이면 학년을 비워 두고 교시만 미리 채움
    openForm({ date: td.dataset.date, slot: td.dataset.slot, grade: allowed.length === 1 ? allowed[0] : null });
  }
};
$("alertBox").onclick = e => {
  const li = e.target.closest("li"); if (!li) return;
  const td = document.querySelector(`td.cell[data-date="${li.dataset.date}"][data-slot="${li.dataset.slot}"]`);
  if (td){ td.scrollIntoView({ behavior:"smooth", block:"center", inline:"center" }); td.classList.remove("flash"); void td.offsetWidth; td.classList.add("flash"); }
};

let toastT;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2200); }

/* ════════════════════════════════════════════════
   9) 로그인
   ════════════════════════════════════════════════ */
async function enter(pw){
  $("loginErr").textContent = "확인 중…";
  const ok = await store.login(pw);
  if (!ok){ $("loginErr").textContent = "비밀번호가 맞지 않아요"; sessionStorage.removeItem("tbs-pw"); return; }
  sessionStorage.setItem("tbs-pw", pw);
  $("loginErr").textContent = "";
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  $("demoBadge").classList.toggle("hidden", !DEMO);
  store.listen(render);
  render();
}
$("loginForm").onsubmit = e => { e.preventDefault(); enter($("pw").value.trim()); };
$("logoutBtn").onclick = () => { sessionStorage.removeItem("tbs-pw"); if (unsub) unsub(); location.reload(); };
const saved = sessionStorage.getItem("tbs-pw"); if (saved) enter(saved);
</script>
